<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Student Management System{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <aside class="side">
    <a class="brand" href="{{ url_for('dashboard') }}">
      <span class="mark" aria-hidden="true">S</span>
      <span>Student<br>Register</span>
    </a>
    <nav>
      <a href="{{ url_for('dashboard') }}" class="{{ 'on' if request.endpoint == 'dashboard' }}">Dashboard</a>
      <a href="{{ url_for('students') }}" class="{{ 'on' if request.endpoint in ('students','edit_student') }}">All students</a>
      <a href="{{ url_for('add_student') }}" class="{{ 'on' if request.endpoint == 'add_student' }}">Add student</a>
      <a href="{{ url_for('export_csv') }}">Download CSV</a>
    </nav>
  </aside>
  <main>
    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% if msgs %}
        <div class="flashes" role="status">
          {% for cat, m in msgs %}<p class="flash {{ cat }}">{{ m }}</p>{% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
